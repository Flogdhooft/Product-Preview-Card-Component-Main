<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700&family=Fraunces:wght@700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="./styles.css">
  
  <title>Frontend Mentor | Product preview card component</title>

</head>
<body>
  <main>

    <article id="product-card">

      <img src="./images/image-product-desktop.jpg" alt="product image" id="product-image">

      <div id="product-infos">

        <h2 id="product-category">PERFUME</h2>
        <h1 id="product-title">Gabrielle Essence Eau De Parfum</h1>
        <p id="product-description">A floral, solar and voluptuous interpretation composed by Olivier Polge, 
    Perfumer-Creator for the House of CHANEL.</p>

        <div id="prices">
          <p id="reduction-price">$149.99</p>
          <p id="original-price">$169.99</p>
        </div>

        <button id="purchase-button">
          <img src="./images/icon-cart.svg" alt="">
          Add to cart
        </button>

      </div>

    </article>

  </main>
      
    <footer class="attribution">
      Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
      Coded by <a href="https://github.com/Flogdhooft">Flogdhooft</a>.
    </footer>

</body>
</html>
